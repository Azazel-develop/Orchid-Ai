<!DOCTYPE html>
<html>

<head>

<title>🌸 Orchid AI v4</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="Avatar/dragon.css">


<style>

*{
box-sizing:border-box;
}


body{

margin:0;

background:

radial-gradient(circle at center,#24004d,#020003 70%);

color:#eee;

font-family:Arial,sans-serif;

min-height:100vh;

overflow-x:hidden;

}



/* hologram background */

body:before{

content:"";

position:fixed;

inset:0;

background:

linear-gradient(
90deg,
transparent 95%,
rgba(160,0,255,.2) 100%
);

background-size:40px 40px;

opacity:.2;

}



.container{

position:relative;

z-index:2;

padding:20px;

text-align:center;

}



.title{

font-size:40px;

color:#d7a0ff;

text-shadow:

0 0 15px purple,
0 0 40px #9b00ff;

}



.core{

margin:auto;

width:170px;

height:170px;

border-radius:50%;

background:

radial-gradient(
circle,
white,
#bb55ff,
#220033
);


box-shadow:

0 0 40px #b000ff,
0 0 100px purple;


animation:pulse 3s infinite;

}



@keyframes pulse{

50%{

transform:scale(1.1);

}

}



.panel{

max-width:650px;

margin:20px auto;

padding:20px;

background:

rgba(15,0,35,.85);


border:

1px solid #8d00ff;


border-radius:25px;


box-shadow:

0 0 30px #7200ff;

}



.status{

color:#dca6ff;

font-size:20px;

}



button{

background:

linear-gradient(
45deg,
#450080,
#b000ff
);


color:white;

border:0;

padding:14px 25px;

border-radius:30px;

margin:5px;

font-size:16px;

}



button:hover{

box-shadow:

0 0 20px purple;

}



input{

width:80%;

padding:15px;

border-radius:20px;

border:0;

background:#08000f;

color:white;

}



.chat{

height:180px;

overflow:auto;

text-align:left;

background:#050007;

padding:15px;

border-radius:15px;

}



.system{

display:grid;

grid-template-columns:1fr 1fr;

gap:10px;

}


.system div{

background:#100020;

padding:15px;

border-radius:15px;

}



</style>


</head>



<body>



<div class="container">


<div class="title">

🌸 ORCHID AI

</div>



<div class="panel">


<div class="core"></div>


<h2 class="status" id="status">

SYSTEM SLEEPING

</h2>


</div>



<!-- DRAGON AREA -->


<div class="panel">


<div id="dragon-container">


<div id="dragon" class="sleeping">


<div class="dragon-body">

🐉

</div>


<div class="wing left-wing"></div>

<div class="wing right-wing"></div>


</div>



<div id="orb">

🌸

</div>


</div>


</div>





<div class="panel">


<div class="chat" id="chat">

Orchid:
Systems online.
Waiting for command.

</div>


<br>


<input id="input"

placeholder="Speak to Orchid">


<br>


<button onclick="listen()">

🎤 Voice

</button>


<button onclick="send()">

Send

</button>


<button onclick="wakeDragon()">

🐉 Wake

</button>


</div>





<div class="panel">


<h3>
SYSTEMS
</h3>


<div class="system">


<div>

🧠 AI Core<br>
Online

</div>


<div>

🐉 Dragon<br>
Active

</div>


<div>

💾 Memory<br>
Ready

</div>


<div>

🎤 Voice<br>
Ready

</div>


</div>


</div>




<div class="panel">


<h3>
Memory
</h3>


<div id="memory">

Empty

</div>


</div>



</div>





<script src="Avatar/dragon.js"></script>



<script>


let memory =
localStorage.getItem(
"orchidMemory"
)||"";


document.getElementById(
"memory"
).innerHTML =
memory || "No memories";




function updateStatus(text){

document.getElementById(
"status"
).innerHTML=text;

}




function speak(text){


dragonTalking();


let msg =
new SpeechSynthesisUtterance(text);


msg.rate=.9;

msg.pitch=1.1;


speechSynthesis.speak(msg);



msg.onend=function(){

sleepDragon();

updateStatus(
"SYSTEM SLEEPING"
);

};


}





function send(){


let text =
document.getElementById(
"input"
).value;


if(!text)return;



chat.innerHTML +=

"<br><b>You:</b> "+text;



memory +=
"<br>"+text;


localStorage.setItem(
"orchidMemory",
memory
);



document.getElementById(
"memory"
).innerHTML=memory;



dragonThinking();

updateStatus(
"THINKING..."
);



setTimeout(()=>{


let reply =
"Command received. Orchid core responding.";



chat.innerHTML +=

"<br><b>Orchid:</b> "+reply;



speak(reply);


},1500);


}





function listen(){



let SpeechRecognition =

window.SpeechRecognition ||

window.webkitSpeechRecognition;



if(!SpeechRecognition){

alert(
"Use Chrome for voice."
);

return;

}



let rec =
new SpeechRecognition();



rec.lang="en-US";


rec.start();



updateStatus(
"LISTENING"
);



rec.onresult=function(e){


let text =
e.results[0][0].transcript;


document.getElementById(
"input"
).value=text;


wakeDragon();


};


}





function clearMemory(){

localStorage.removeItem(
"orchidMemory"
);

memory="";


}



</script>



</body>

</html>
