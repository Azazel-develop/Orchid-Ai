<!DOCTYPE html>
<html>
<head>

<title>Orchid AI v3</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
overflow:hidden;
background:
linear-gradient(135deg,#05000f,#26004d,#05000f);
color:#fff;
font-family:Arial;
height:100vh;
}


#stars{
position:fixed;
inset:0;
background:
radial-gradient(circle,#9d4dff 1px,transparent 2px);
background-size:40px 40px;
opacity:.15;
}


.container{

position:relative;
z-index:2;
text-align:center;
padding:20px;

}


h1{

color:#dcb0ff;
text-shadow:
0 0 10px #a000ff,
0 0 30px #ff00ff;

}



.core{

width:170px;
height:170px;
margin:auto;
border-radius:50%;

background:
radial-gradient(circle,#fff,#c05cff,#5200aa);

box-shadow:
0 0 30px purple,
0 0 80px #a000ff;

animation:pulse 2s infinite;

}


@keyframes pulse{

50%{
transform:scale(1.08);
}

}



#dragon{

font-size:90px;
position:absolute;
top:180px;
left:50%;

animation:float 5s infinite;

}


@keyframes float{

50%{
transform:translate(-40px,-20px);

}

}



.panel{

background:
rgba(40,0,80,.7);

border:1px solid #b85cff;

border-radius:25px;

padding:20px;

margin:20px auto;

max-width:600px;

box-shadow:
0 0 25px purple;

}



button{

background:#9b32ff;

color:white;

border:0;

padding:12px 20px;

border-radius:25px;

font-size:16px;

margin:5px;

}



input{

width:80%;

padding:15px;

border-radius:20px;

border:0;

}



#wave{

height:20px;

margin:20px;

}



.bar{

display:inline-block;

width:5px;

height:20px;

background:#d47cff;

margin:3px;

animation:sound .5s infinite alternate;

}



@keyframes sound{

to{
height:50px;
}

}


</style>

</head>


<body>


<div id="stars"></div>


<div class="container">


<h1>🌸 Orchid AI</h1>


<div id="dragon">
🐉
</div>


<div class="core"></div>


<div class="panel">


<h2 id="status">
Sleeping
</h2>


<div id="wave">

</div>


<input id="input"
placeholder="Say Hey Orchid...">


<br>


<button onclick="listen()">
🎤 Activate Voice
</button>


<button onclick="send()">
Send
</button>


</div>



<div class="panel">


<div id="chat">

Orchid: Systems online.

</div>


</div>



</div>





<script>


let chat=document.getElementById("chat");


let recognition;



function speak(text){


let voices=speechSynthesis.getVoices();


let msg=new SpeechSynthesisUtterance(text);


msg.rate=.9;

msg.pitch=1.1;


if(voices.length){

msg.voice=
voices.find(v=>v.lang.includes("en"))
|| voices[0];

}


speechSynthesis.speak(msg);


}





function wakeAnimation(){


document.getElementById("dragon")
.innerHTML="🐉🔥";


document.getElementById("status")
.innerHTML="Orchid Awake";


setTimeout(()=>{

document.getElementById("dragon")
.innerHTML="🐉";

},2000);


}





function listen(){


let SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(!SpeechRecognition){

alert("Use Chrome for voice");

return;

}



recognition =
new SpeechRecognition();


recognition.continuous=false;


recognition.lang="en-US";


recognition.start();


document.getElementById("status")
.innerHTML="🎤 Listening";



recognition.onresult=function(event){


let text=
event.results[0][0].transcript;


document.getElementById("input")
.value=text;


wakeAnimation();



if(text.toLowerCase()
.includes("hey orchid")){


speak(
"Hello. Orchid is listening."
);


}


};



}





function send(){


let text=
document.getElementById("input").value;



chat.innerHTML +=
"<br><b>You:</b> "+text;



let reply=
"I heard you. My AI core is ready for upgrade.";



chat.innerHTML +=
"<br><b>Orchid:</b> "+reply;



speak(reply);


}





</script>


</body>
</html>
