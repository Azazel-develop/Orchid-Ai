<!DOCTYPE html>
<html>

<head>

<title>Orchid AI v2</title>

<style>

body{
background:#080012;
color:#e8ccff;
font-family:Arial;
text-align:center;
}

.container{
margin:30px auto;
width:90%;
max-width:600px;
background:#160029;
padding:25px;
border-radius:25px;
box-shadow:0 0 40px purple;
}

#dragon{
font-size:90px;
transition:0.5s;
}

button{
background:#8b2cff;
color:white;
border:0;
padding:12px;
border-radius:20px;
margin:5px;
}

input{
padding:12px;
border-radius:15px;
width:70%;
}

.panel{
background:#050008;
padding:15px;
margin:15px;
border-radius:15px;
}

</style>

</head>


<body>


<div class="container">

<h1>🌸 Orchid AI</h1>


<div id="dragon">
🐉
</div>


<div class="panel">

<div id="status">
Sleeping...
</div>

</div>


<div class="panel">

<div id="chat">
Orchid: Voice system ready.
</div>

</div>


<input id="message"
placeholder="Speak or type">


<br>


<button onclick="listen()">
🎤 Listen
</button>


<button onclick="send()">
Send
</button>


<button onclick="clearMemory()">
Clear Memory
</button>



<div class="panel">

<h3>Memory</h3>

<div id="memory">
Empty
</div>

</div>


</div>



<script>


let memory =
localStorage.getItem("orchidMemory")
|| "";

document.getElementById("memory").innerHTML =
memory || "No memories";



function send(){


let text =
document.getElementById("message").value;


document.getElementById("chat").innerHTML +=
"<br>You: "+text;


memory += "<br>"+text;


localStorage.setItem(
"orchidMemory",
memory
);


document.getElementById("memory").innerHTML =
memory;


speak(
" I heard you. My systems are working."
);


}



function listen(){


let SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if(!SpeechRecognition){

alert(
"Speech recognition not supported"
);

return;

}


let recognition =
new SpeechRecognition();


recognition.start();


document.getElementById("status").innerHTML =
"🎤 Listening...";


recognition.onresult=function(event){


let text =
event.results[0][0].transcript;


document.getElementById("message").value =
text;


dragonWake();


};


}



function speak(text){


let voice =
new SpeechSynthesisUtterance(text);


speechSynthesis.speak(voice);

}



function dragonWake(){


document.getElementById("dragon").innerHTML =
"🐉🔥";


document.getElementById("status").innerHTML =
"Orchid Awake";


setTimeout(()=>{

document.getElementById("dragon").innerHTML =
"🐉";

},2000);


}



function clearMemory(){

localStorage.removeItem(
"orchidMemory"
);

document.getElementById("memory").innerHTML =
"Empty";

}


</script>


</body>

</html>
