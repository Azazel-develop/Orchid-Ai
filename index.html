<!DOCTYPE html>
<html>
<head>

<title>Orchid AI</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
margin:0;
background:
radial-gradient(circle,#3b0066,#050008);
color:white;
font-family:Arial,sans-serif;
text-align:center;
min-height:100vh;
}


#app{
padding:20px;
}


h1{
color:#d58cff;
text-shadow:0 0 20px purple;
}


.card{

background:rgba(30,0,60,.8);
border:1px solid #8f3cff;
border-radius:25px;
padding:20px;
margin:20px auto;
max-width:600px;
box-shadow:0 0 30px #7200ff;

}


#dragon{

font-size:100px;
animation:fly 4s infinite;

}


@keyframes fly{

0%{transform:translateY(0)}
50%{transform:translateY(-20px)}
100%{transform:translateY(0)}

}


.awake{

animation:fire .5s infinite;

}


@keyframes fire{

50%{
filter:drop-shadow(0 0 30px orange);
}

}


button{

background:#8b2cff;
border:none;
color:white;
padding:12px 20px;
border-radius:25px;
margin:5px;
font-size:16px;

}


button:hover{

background:#c05cff;

}


input{

width:80%;
padding:14px;
border-radius:20px;
border:none;

}


#chat{

min-height:100px;
text-align:left;

}


#memory{

font-size:13px;
opacity:.8;

}


</style>

</head>


<body>


<div id="app">


<h1>🌸 Orchid AI</h1>


<div class="card">

<div id="dragon">
🐉
</div>

<div id="status">
Sleeping...
</div>


</div>



<div class="card">


<div id="chat">
Orchid: Online. Waiting for commands.
</div>


<br>


<input id="input"
placeholder="Talk to Orchid...">


<br>


<button onclick="listen()">
🎤 Voice
</button>


<button onclick="send()">
Send
</button>


<button onclick="wake()">
🐉 Wake
</button>


</div>




<div class="card">


<h3>
🧠 Memory
</h3>


<div id="memory">
Loading...
</div>


<button onclick="clearMemory()">
Clear
</button>


</div>


</div>




<script>


let memory =
localStorage.getItem("orchid_memory") || "";


document.getElementById("memory").innerHTML =
memory || "No memories yet";




function wake(){

let d=document.getElementById("dragon");

d.innerHTML="🐉🔥";

d.classList.add("awake");

document.getElementById("status").innerHTML=
"Orchid Awake";


setTimeout(()=>{

d.innerHTML="🐉";
d.classList.remove("awake");

},3000);


}




function speak(text){

let voice =
new SpeechSynthesisUtterance(text);


voice.pitch=1.2;

voice.rate=1;


speechSynthesis.speak(voice);

}





function send(){


let text =
document.getElementById("input").value;


if(!text)return;


document.getElementById("chat").innerHTML +=
"<br><b>You:</b> "+text;



memory += "<br>"+text;


localStorage.setItem(
"orchid_memory",
memory
);


document.getElementById("memory").innerHTML=
memory;



wake();



let reply="I heard you.";



if(text.toLowerCase().includes("timer")){

reply="Timer command detected. Timer system will be added soon.";

}



if(text.toLowerCase().includes("hello")){

reply="Hello. I am Orchid, your AI companion.";

}



document.getElementById("chat").innerHTML +=
"<br><b>Orchid:</b> "+reply;


speak(reply);



}





function listen(){


let SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;



if(!SpeechRecognition){

alert(
"Voice recognition is not supported. Try Chrome."
);

return;

}



let rec=new SpeechRecognition();


rec.lang="en-US";


rec.start();



document.getElementById("status").innerHTML=
"🎤 Listening...";



rec.onresult=function(e){


let words =
e.results[0][0].transcript;


document.getElementById("input").value=
words;


wake();


};



}





function clearMemory(){

localStorage.removeItem(
"orchid_memory"
);


memory="";


document.getElementById("memory").innerHTML=
"Empty";


}



</script>


</body>
</html>
